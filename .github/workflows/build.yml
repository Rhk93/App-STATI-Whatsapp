name: Compila APK

on:
  push:
    paths:
      - 'SalvaStati.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Estrai lo zip
        run: |
          mkdir progetto
          unzip -q SalvaStati.zip -d progetto
          cd progetto
          if [ ! -f settings.gradle ]; then cd */; fi
          echo "DIR=$(pwd)" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compila
        run: cd "$DIR" && gradle assembleRelease --no-daemon

      - name: Rinomina APK
        run: cp "$DIR"/app/build/outputs/apk/release/app-release.apk SalvaStati.apk

      - name: Crea Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Salva Stati v${{ github.run_number }}
          files: SalvaStati.apk
